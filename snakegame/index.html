<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        canvas {
            border: 3px solid white;
            background-color: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: block;
        }

        #scoreContainer {
            display: flex;
            gap: 40px;
            justify-content: center;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
        }

        #score, #highScore {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 5px;
        }

        #gameOverScreen {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
            border: 3px solid white;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        #gameOverScreen h2 {
            color: #ff4444;
            font-size: 3em;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        #gameOverScreen p {
            color: #ffff00;
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #retryBtn {
            background-color: #00cc00;
            color: black;
        }

        #retryBtn:hover {
            background-color: #00ff00;
            transform: scale(1.05);
        }

        #quitBtn {
            background-color: #cc0000;
            color: white;
        }

        #quitBtn:hover {
            background-color: #ff0000;
            transform: scale(1.05);
        }

        .instructions {
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 5px;
            max-width: 600px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            color: white;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-box {
            width: 20px;
            height: 20px;
            border: 1px solid white;
        }

        .legend-head {
            background-color: #ffff00;
        }

        .legend-body {
            background-color: #00ff00;
        }

        .legend-apple {
            background-color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 Snake Game</h1>
       
        <div id="gameContainer">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
           
            <div id="scoreContainer">
                <div>Score: <span id="score">0</span></div>
                <div>High Score: <span id="highScore">0</span></div>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-box legend-head"></div>
                    <span>Snake Head</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box legend-body"></div>
                    <span>Snake Body</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box legend-apple"></div>
                    <span>Apple</span>
                </div>
            </div>
        </div>

        <div class="instructions">
            <p><strong>How to Play:</strong></p>
            <p>Use <strong>Arrow Keys</strong> (↑ ↓ ← →) to move the snake</p>
            <p>Eat the red apples to grow and earn 1 point each</p>
            <p>Don't hit the walls or yourself!</p>
        </div>
    </div>

    <div id="gameOverScreen">
        <h2>YOU LOST!</h2>
        <p id="finalScore">Final Score: 0</p>
        <div class="button-group">
            <button id="retryBtn">🔄 Retry</button>
            <button id="quitBtn">❌ Quit</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const retryBtn = document.getElementById('retryBtn');
        const quitBtn = document.getElementById('quitBtn');

        // Game constants
        const GRID_SIZE = 20;
        const GAME_SPEED = 10; // Speed in FPS
        const PIXEL_SIZE = 4; // Size of each pixel in the face

        // Game variables
        let snake = [{ x: 20, y: 15 }];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let apple = { x: 0, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameOver = false;
        let gameRunning = true;

        // Initialize high score display
        highScoreDisplay.textContent = highScore;

        // Spawn apple at random position
        function spawnApple() {
            apple.x = Math.floor(Math.random() * (canvas.width / GRID_SIZE));
            apple.y = Math.floor(Math.random() * (canvas.height / GRID_SIZE));
        }

        // Draw pixelated face on the head
        function drawFace(x, y, direction) {
            const baseX = x * GRID_SIZE;
            const baseY = y * GRID_SIZE;
            const p = PIXEL_SIZE;

            // Draw eyes based on direction
            ctx.fillStyle = '#000000';

            if (direction.x === 1) { // Moving right
                // Right eye
                ctx.fillRect(baseX + 12, baseY + 6, p, p);
                ctx.fillRect(baseX + 12, baseY + 10, p, p);
                // Left eye (smaller, further back)
                ctx.fillRect(baseX + 6, baseY + 8, p, p);
            } else if (direction.x === -1) { // Moving left
                // Left eye
                ctx.fillRect(baseX + 4, baseY + 6, p, p);
                ctx.fillRect(baseX + 4, baseY + 10, p, p);
                // Right eye (smaller, further back)
                ctx.fillRect(baseX + 10, baseY + 8, p, p);
            } else if (direction.y === -1) { // Moving up
                // Top eyes
                ctx.fillRect(baseX + 6, baseY + 4, p, p);
                ctx.fillRect(baseX + 12, baseY + 4, p, p);
                // Bottom pupil
                ctx.fillRect(baseX + 9, baseY + 8, p, p);
            } else if (direction.y === 1) { // Moving down
                // Bottom eyes
                ctx.fillRect(baseX + 6, baseY + 12, p, p);
                ctx.fillRect(baseX + 12, baseY + 12, p, p);
                // Top pupil
                ctx.fillRect(baseX + 9, baseY + 8, p, p);
            }

            // Draw mouth (simple smile/expression)
            ctx.fillStyle = '#000000';
            if (direction.y !== 0) {
                ctx.fillRect(baseX + 6, baseY + 16, p, p);
                ctx.fillRect(baseX + 9, baseY + 16, p, p);
                ctx.fillRect(baseX + 12, baseY + 16, p, p);
            }
        }

        // Update game state
        function update() {
            if (gameOver) return;

            // Update direction
            direction = nextDirection;

            // Calculate new head position
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Check wall collision
            if (head.x < 0 || head.x >= canvas.width / GRID_SIZE ||
                head.y < 0 || head.y >= canvas.height / GRID_SIZE) {
                endGame();
                return;
            }

            // Check self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            // Add new head
            snake.unshift(head);

            // Check if apple eaten
            if (head.x === apple.x && head.y === apple.y) {
                score += 1;
                scoreDisplay.textContent = score;
                spawnApple();
            } else {
                // Remove tail if no apple eaten
                snake.pop();
            }
        }

        // Draw everything
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw snake body (green)
            ctx.fillStyle = '#00ff00';
            snake.slice(1).forEach((segment) => {
                ctx.fillRect(
                    segment.x * GRID_SIZE,
                    segment.y * GRID_SIZE,
                    GRID_SIZE - 1,
                    GRID_SIZE - 1
                );
            });

            // Draw snake head (yellow)
            ctx.fillStyle = '#ffff00';
            const head = snake[0];
            ctx.fillRect(
                head.x * GRID_SIZE,
                head.y * GRID_SIZE,
                GRID_SIZE - 1,
                GRID_SIZE - 1
            );

            // Draw face on the head
            drawFace(head.x, head.y, direction);

            // Draw apple (red)
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(
                apple.x * GRID_SIZE,
                apple.y * GRID_SIZE,
                GRID_SIZE - 1,
                GRID_SIZE - 1
            );
        }

        // End game
        function endGame() {
            gameOver = true;
            gameOverScreen.style.display = 'block';
            finalScoreDisplay.textContent = `Final Score: ${score}`;

            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreDisplay.textContent = highScore;
            }
        }

        // Retry game
        function retryGame() {
            snake = [{ x: 20, y: 15 }];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            scoreDisplay.textContent = score;
            gameOver = false;
            gameOverScreen.style.display = 'none';
            spawnApple();
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameOver) {
                switch(e.key) {
                    case 'ArrowUp':
                        if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                        if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                        if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                        if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                        e.preventDefault();
                        break;
                }
            }
        });

        // Button events
        retryBtn.addEventListener('click', retryGame);
        quitBtn.addEventListener('click', () => {
            location.reload();
        });

        // Initialize game
        spawnApple();
        setInterval(gameLoop, 1000 / GAME_SPEED);
    </script>
</body>
</html>
