<!DOCTYPE html>
<html>
<head>
    <title>Flappy Bat</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        #game-world { position: relative; width: 100vw; height: 100vh; background: linear-gradient(to bottom, #2c3e50, #000000); overflow: hidden; }
        
        #bat { 
            position: absolute; 
            width: 100px; 
            height: 80px; 
            background-image: url('bat.svg'); 
            background-size: contain; 
            background-repeat: no-repeat; 
            left: 50%; 
            margin-left: -50px; 
            z-index: 5; 
            transition: transform 0.1s; 
        }

        .obstacle { position: absolute; width: 60px; background-color: #8b4513; right: -60px; }
        .top { top: 0; border-bottom: 10px solid #5d2e0c; border-radius: 0 0 10px 10px; }
        .bottom { bottom: 0; border-top: 10px solid #5d2e0c; border-radius: 10px 10px 0 0; }
        #score { position: absolute; top: 20px; left: 20px; color: white; font-family: 'Courier New', Courier, monospace; font-size: 36px; z-index: 10; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>
    <div id="game-world">
        <div id="score">Score: 0</div>
        <div id="bat"></div>
    </div>
    <script>
        const bat = document.getElementById('bat');
        const gameWorld = document.getElementById('game-world');
        const scoreElement = document.getElementById('score');
        const flapSound = new Audio('mixkit-air-woosh-1489.wav');
        let batY = window.innerHeight / 2 - 20;
        let velocity = 0, gravity = 0.35, score = 0, gameActive = true, obstacles = [];

        function flap() { 
            if (gameActive) { 
                velocity = -6.5; 
                flapSound.currentTime = 0; 
                flapSound.play(); 
            } else { 
                resetGame(); 
            } 
        }

        function createObstacle() {
            const gap = 220, minHeight = 60; 
            const topHeight = Math.random() * (window.innerHeight - gap - (minHeight * 2)) + minHeight;
            const topPipe = document.createElement('div'); 
            topPipe.className = 'obstacle top'; 
            topPipe.style.height = topHeight + 'px'; 
            topPipe.style.right = '-60px';
            const bottomPipe = document.createElement('div'); 
            bottomPipe.className = 'obstacle bottom'; 
            bottomPipe.style.height = (window.innerHeight - topHeight - gap) + 'px'; 
            bottomPipe.style.right = '-60px';
            gameWorld.appendChild(topPipe); 
            gameWorld.appendChild(bottomPipe);
            obstacles.push({ top: topPipe, bottom: bottomPipe, right: -60, passed: false });
        }

        function update() {
            if (!gameActive) return;
            velocity += gravity;
            batY += velocity;
            bat.style.top = batY + 'px';
            
            const rotation = Math.min(velocity * 3, 90);
            bat.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
            
            // Adjusted ceiling and floor collision with 10px leeway
            if ((batY + 10) < 0 || (batY + 70) > window.innerHeight) gameOver();

            obstacles.forEach((obj, index) => {
                obj.right += 4;
                obj.top.style.right = obj.right + 'px';
                obj.bottom.style.right = obj.right + 'px';
                
                const batRect = bat.getBoundingClientRect(), 
                      topRect = obj.top.getBoundingClientRect(), 
                      bottomRect = obj.bottom.getBoundingClientRect();
                
                // Adjusted collision detection for dripstones with 10px margin on top and bottom
                if (batRect.right > topRect.left && batRect.left < topRect.right) { 
                    if ((batRect.top + 10) < topRect.bottom || (batRect.bottom - 10) > bottomRect.top) gameOver(); 
                }
                
                if (!obj.passed && topRect.right < batRect.left) { 
                    obj.passed = true; 
                    score++; 
                    scoreElement.innerText = 'Score: ' + score; 
                }
                
                if (obj.right > window.innerWidth + 100) { 
                    obj.top.remove(); 
                    obj.bottom.remove(); 
                    obstacles.splice(index, 1); 
                }
            });
            requestAnimationFrame(update);
        }

        function gameOver() { 
            gameActive = false; 
            setTimeout(() => { 
                alert("Game Over!\nScore: " + score + "\nPress Space to Restart"); 
            }, 10); 
        }

        function resetGame() { 
            batY = window.innerHeight / 2 - 20; 
            velocity = 0; 
            score = 0; 
            scoreElement.innerText = 'Score: 0'; 
            obstacles.forEach(obj => { obj.top.remove(); obj.bottom.remove(); }); 
            obstacles = []; 
            gameActive = true; 
            update(); 
        }

        window.addEventListener('keydown', (e) => { 
            if (e.code === 'Space') { 
                e.preventDefault(); 
                flap(); 
            } 
        });

        setInterval(() => { if (gameActive) createObstacle(); }, 2200);
        update();
    </script>
</body>
</html>
