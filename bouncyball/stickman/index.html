<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Stickman Adventure</title>
        <style>
            body { margin: 0; overflow: hidden; background: #f0f0f0; font-family: sans-serif; }
            canvas { display: block; background: #fff; }
            #ui { position: absolute; top: 10px; left: 10px; font-size: 20px; font-weight: bold; pointer-events: none; }
        </style>
    </head>
    <body>
        <div id="ui">Score: 0</div>
        <canvas id="gameCanvas"></canvas>
        <script>
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const ui = document.getElementById('ui');
    
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
    
            let score = 0;
            let gameOver = false;
            let difficulty = 1;
    
            const player = {
                x: 50, y: canvas.height - 100,
                w: 20, h: 50,
                vx: 0, vy: 0,
                speed: 5, jumpPower: -15,
                grounded: false
            };
    
            const gravity = 0.8;
            const keys = {};
            const projectiles = [];
            let coin = { x: Math.random() * (canvas.width - 20), y: canvas.height - 150, r: 10 };
    
            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
    
            function spawnProjectile() {
                const side = Math.random() > 0.5 ? 'left' : 'right';
                projectiles.push({
                    x: side === 'left' ? -20 : canvas.width + 20,
                    y: canvas.height - 40 - Math.random() * 100,
                    vx: (side === 'left' ? 1 : -1) * (3 + difficulty),
                    size: 10
                });
            }
    
            let lastSpawn = 0;
            function update(time) {
                if (gameOver) return;
    
                // Player movement
                if (keys['ArrowLeft']) player.vx = -player.speed;
                else if (keys['ArrowRight']) player.vx = player.speed;
                else player.vx = 0;
    
                if (keys['Space'] && player.grounded) {
                    player.vy = player.jumpPower;
                    player.grounded = false;
                }
    
                player.vy += gravity;
                player.x += player.vx;
                player.y += player.vy;
    
                // Boundaries & Ground
                if (player.x < 0) player.x = 0;
                if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;
                if (player.y > canvas.height - player.h - 20) {
                    player.y = canvas.height - player.h - 20;
                    player.vy = 0;
                    player.grounded = true;
                }
    
                // Coin collection
                const dx = (player.x + player.w/2) - coin.x;
                const dy = (player.y + player.h/2) - coin.y;
                if (Math.sqrt(dx*dx + dy*dy) < 25) {
                    score++;
                    ui.innerText = 'Score: ' + score;
                    difficulty += 0.1;
                    coin.x = Math.random() * (canvas.width - 40) + 20;
                    coin.y = canvas.height - 100 - Math.random() * 200;
                }
    
                // Projectiles
                if (time - lastSpawn > 2000 / difficulty) {
                    spawnProjectile();
                    lastSpawn = time;
                }
    
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const p = projectiles[i];
                    p.x += p.vx;
                    
                    // Collision
                    if (p.x < player.x + player.w && p.x + p.size > player.x &&
                        p.y < player.y + player.h && p.y + p.size > player.y) {
                        gameOver = true;
                        alert('Game Over! Score: ' + score);
                        location.reload();
                    }
    
                    if (p.x < -50 || p.x > canvas.width + 50) projectiles.splice(i, 1);
                }
    
                draw();
                requestAnimationFrame(update);
            }
    
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
    
                // Ground
                ctx.fillStyle = '#666';
                ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
    
                // Stickman
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                const px = player.x + player.w/2;
                const py = player.y;
                // Head
                ctx.beginPath(); ctx.arc(px, py + 10, 8, 0, Math.PI*2); ctx.stroke();
                // Body
                ctx.beginPath(); ctx.moveTo(px, py + 18); ctx.lineTo(px, py + 35); ctx.stroke();
                // Arms
                ctx.beginPath(); ctx.moveTo(px - 10, py + 25); ctx.lineTo(px + 10, py + 25); ctx.stroke();
                // Legs
                ctx.beginPath(); ctx.moveTo(px, py + 35); ctx.lineTo(px - 8, py + 50); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(px, py + 35); ctx.lineTo(px + 8, py + 50); ctx.stroke();
    
                // Coin
                ctx.fillStyle = '#ffd700';
                ctx.beginPath(); ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI*2); ctx.fill();
    
                // Projectiles (Cannons balls)
                ctx.fillStyle = '#ff4444';
                projectiles.forEach(p => {
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                });
            }
    
            requestAnimationFrame(update);
        </script>
    </body>
    </html>
