<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #00ff00;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff00;
        }

        #gameCanvas {
            background: #000;
            border: 3px solid #00ff00;
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 20px #00ff00;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            color: #00ff00;
            font-size: 1.5em;
            font-weight: bold;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .player-score {
            background: rgba(0, 255, 0, 0.1);
            padding: 10px 30px;
            border-radius: 5px;
            border: 2px solid #00ff00;
            flex: 1;
        }

        .instructions {
            color: #00ff00;
            margin-top: 30px;
            font-size: 1em;
            text-shadow: 0 0 5px #00ff00;
        }

        .instructions p {
            margin: 10px 0;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex !important;
        }

        #gameOverScreen {
            background: rgba(0, 0, 0, 0.95);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid #00ff00;
            box-shadow: 0 0 30px #00ff00;
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        #gameOverScreen h2 {
            color: #00ff00;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
        }

        #gameOverScreen p {
            color: #00ff00;
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        #tryAgainBtn {
            padding: 15px 40px;
            font-size: 1.2em;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #tryAgainBtn:hover {
            background: #00cc00;
            transform: scale(1.05);
            box-shadow: 0 0 15px #00ff00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 PONG 🎮</h1>
       
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="score-board">
            <div class="player-score">
                You<br>
                <span id="playerScore">0</span>
            </div>
            <div class="player-score">
                Computer<br>
                <span id="computerScore">0</span>
            </div>
        </div>

        <div class="instructions">
            <p><strong>Controls:</strong> Use <strong>W/S</strong> or <strong>UP/DOWN Arrow Keys</strong> to move your paddle</p>
            <p>Beat the computer! First to 3 points wins!</p>
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div id="gameOverScreen">
            <h2 id="winnerText">You Win!</h2>
            <p id="finalScore">Final Score: 3 - 0</p>
            <button id="tryAgainBtn">Try Again</button>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game variables
        const gameWidth = canvas.width;
        const gameHeight = canvas.height;
        const paddleHeight = 100;
        const paddleWidth = 10;
        const ballSize = 8;
        const paddleSpeed = 8;
        const ballSpeed = 4;
        const WINNING_SCORE = 3;

        let playerScore = 0;
        let computerScore = 0;
        let gameOver = false;

        // Keyboard tracking
        const keys = {
            'w': false,
            's': false,
            'arrowup': false,
            'arrowdown': false
        };

        // Listen for key down
        document.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            if (key === 'w') {
                keys['w'] = true;
            }
            if (key === 's') {
                keys['s'] = true;
            }
            if (key === 'arrowup') {
                keys['arrowup'] = true;
                event.preventDefault();
            }
            if (key === 'arrowdown') {
                keys['arrowdown'] = true;
                event.preventDefault();
            }
        });

        // Listen for key up
        document.addEventListener('keyup', (event) => {
            const key = event.key.toLowerCase();
            if (key === 'w') {
                keys['w'] = false;
            }
            if (key === 's') {
                keys['s'] = false;
            }
            if (key === 'arrowup') {
                keys['arrowup'] = false;
            }
            if (key === 'arrowdown') {
                keys['arrowdown'] = false;
            }
        });

        // Player Paddle (Left)
        const playerPaddle = {
            x: 20,
            y: gameHeight / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            draw: function() {
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowColor = '#00ff00';
                ctx.shadowBlur = 10;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            },
            update: function() {
                if (keys['w'] || keys['arrowup']) {
                    this.y -= paddleSpeed;
                }
                if (keys['s'] || keys['arrowdown']) {
                    this.y += paddleSpeed;
                }

                if (this.y < 0) this.y = 0;
                if (this.y + this.height > gameHeight) this.y = gameHeight - this.height;
            }
        };

        // Computer Paddle (Right)
        const computerPaddle = {
            x: gameWidth - paddleWidth - 20,
            y: gameHeight / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            difficulty: 0.25,
            draw: function() {
                ctx.fillStyle = '#ff00ff';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowColor = '#ff00ff';
                ctx.shadowBlur = 10;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            },
            update: function() {
                this.y += this.dy;
                if (this.y < 0) this.y = 0;
                if (this.y + this.height > gameHeight) this.y = gameHeight - this.height;
            },
            ai: function() {
                const paddleCenter = this.y + this.height / 2;
                const ballCenter = ball.y;
                const distance = ballCenter - paddleCenter;

                if (Math.abs(distance) > 10) {
                    if (Math.random() > this.difficulty) {
                        if (distance < -20) {
                            this.dy = -paddleSpeed * 0.9;
                        } else if (distance > 20) {
                            this.dy = paddleSpeed * 0.9;
                        } else {
                            this.dy = (distance / 100) * paddleSpeed;
                        }
                    } else {
                        if (Math.random() > 0.7) {
                            this.dy = -paddleSpeed * 0.5;
                        } else {
                            this.dy = 0;
                        }
                    }
                } else {
                    this.dy = 0;
                }
            }
        };

        // Ball
        const ball = {
            x: gameWidth / 2,
            y: gameHeight / 2,
            dx: ballSpeed,
            dy: ballSpeed,
            radius: ballSize,
            draw: function() {
                ctx.fillStyle = '#00ff00';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowColor = '#00ff00';
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            },
            update: function() {
                this.x += this.dx;
                this.y += this.dy;

                if (this.y - this.radius < 0 || this.y + this.radius > gameHeight) {
                    this.dy = -this.dy;
                    if (this.y - this.radius < 0) this.y = this.radius;
                    if (this.y + this.radius > gameHeight) this.y = gameHeight - this.radius;
                }

                if (
                    this.x - this.radius < playerPaddle.x + playerPaddle.width &&
                    this.y > playerPaddle.y &&
                    this.y < playerPaddle.y + playerPaddle.height
                ) {
                    this.dx = Math.abs(this.dx);
                    this.x = playerPaddle.x + playerPaddle.width + this.radius;
                    let hitPos = (this.y - (playerPaddle.y + playerPaddle.height / 2)) / (playerPaddle.height / 2);
                    this.dy = hitPos * ballSpeed * 1.5;
                }

                if (
                    this.x + this.radius > computerPaddle.x &&
                    this.y > computerPaddle.y &&
                    this.y < computerPaddle.y + computerPaddle.height
                ) {
                    this.dx = -Math.abs(this.dx);
                    this.x = computerPaddle.x - this.radius;
                    let hitPos = (this.y - (computerPaddle.y + computerPaddle.height / 2)) / (computerPaddle.height / 2);
                    this.dy = hitPos * ballSpeed * 1.5;
                }

                if (this.x < 0) {
                    computerScore++;
                    console.log('Computer scores! Score:', playerScore, '-', computerScore);
                   
                    if (computerScore >= WINNING_SCORE) {
                        gameOver = true;
                        showGameOver();
                        return;
                    }
                    this.resetBall();
                }
               
                if (this.x > gameWidth) {
                    playerScore++;
                    console.log('Player scores! Score:', playerScore, '-', computerScore);
                   
                    if (playerScore >= WINNING_SCORE) {
                        gameOver = true;
                        showGameOver();
                        return;
                    }
                    this.resetBall();
                }
            },
            resetBall: function() {
                this.x = gameWidth / 2;
                this.y = gameHeight / 2;
                this.dx = ballSpeed * (Math.random() > 0.5 ? 1 : -1);
                this.dy = ballSpeed * (Math.random() > 0.5 ? 1 : -1);
            }
        };

        // Reset game function
        function resetGame() {
            console.log('Game reset!');
            playerScore = 0;
            computerScore = 0;
            gameOver = false;
           
            playerPaddle.y = gameHeight / 2 - paddleHeight / 2;
            computerPaddle.y = gameHeight / 2 - paddleHeight / 2;
           
            ball.resetBall();
           
            const modal = document.getElementById('modalOverlay');
            modal.classList.remove('show');
            modal.style.display = 'none';
        }

        // Show game over screen
        function showGameOver() {
            console.log('showGameOver called');
            const modal = document.getElementById('modalOverlay');
            const winner = document.getElementById('winnerText');
            const finalScore = document.getElementById('finalScore');

            if (playerScore >= WINNING_SCORE) {
                winner.textContent = '🎉 You Win!';
            } else {
                winner.textContent = '😢 You Lost!';
            }

            finalScore.textContent = `Final Score: ${playerScore} - ${computerScore}`;
           
            modal.style.display = 'flex';
            modal.classList.add('show');
            console.log('Modal should now be visible');
        }

        // Try Again button event listener
        document.getElementById('tryAgainBtn').addEventListener('click', resetGame);

        // Update game state
        function update() {
            if (!gameOver) {
                playerPaddle.update();
                computerPaddle.ai();
                computerPaddle.update();
                ball.update();
            }
        }

        // Draw game
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, gameWidth, gameHeight);

            ctx.strokeStyle = '#00ff00';
            ctx.setLineDash([10, 10]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(gameWidth / 2, 0);
            ctx.lineTo(gameWidth / 2, gameHeight);
            ctx.stroke();
            ctx.setLineDash([]);

            playerPaddle.draw();
            computerPaddle.draw();
            ball.draw();

            document.getElementById('playerScore').textContent = playerScore;
            document.getElementById('computerScore').textContent = computerScore;
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
