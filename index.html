<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaotic Pigeon Presents</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header { margin-top: 50px; margin-bottom: 20px; text-align: center; }
        h1 { font-size: 2.5rem; font-weight: 800; color: #1a1a1a; margin: 0; }
        h2 { margin-top: 40px; color: #333; }
        .game-wrapper { display: flex; flex-direction: column; align-items: center; margin-bottom: 50px; }
        
        /* This creates the placeholder box where the game was */
        .game-placeholder {
            width: 600px;
            height: 400px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .game-placeholder:hover {
            transform: scale(1.02);
            background: #fafafa;
        }

        /* The Play Button style */
        .play-btn {
            background: #1a1a1a;
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .footer { margin-top: auto; padding: 40px; color: #666; }

        @media (max-width: 650px) {
            .game-placeholder { width: 90vw; height: 60vw; }
        }
    </style>
</head>
<body>

    <header><h1>Chaotic Pigeon Presents...</h1></header>

    <div class="game-wrapper">
        <h2>Bouncy Ball</h2>
        <a href="/bouncyball/index.html" target="_blank" class="game-placeholder">
            <div class="play-btn">Play Game ▶</div>
        </a>
    </div>

    <div class="game-wrapper">
        <h2>Stickman Adventure</h2>
        <a href="/stickman/index.html" target="_blank" class="game-placeholder">
            <div class="play-btn">Play Game ▶</div>
        </a>
    </div>
<div class="game-wrapper">
        <h2>Flappy Bat</h2>
        <a href="/Bananas/Cave%20Bat/index.html" target="_blank" class="game-placeholder">
            <div class="play-btn">Play Game ▶</div>
        </a>
    </div>
    <div class="footer"><p>Built by Elliott</p></div>

</body>
</html>
