<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaotic Pigeon Presents</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin-top: 50px;
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #1a1a1a;
            margin: 0;
        }

        h2 {
            margin-top: 40px;
            color: #333;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
        }

        .game-container {
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px solid #fff;
        }

        iframe {
            width: 600px;
            height: 400px;
            border: none;
            border-radius: 10px;
            display: block;
            background: #fff;
        }

        .external-controls {
            margin-top: 20px;
        }

        .btn {
            text-decoration: none;
            background: #1a1a1a;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .footer {
            margin-top: auto;
            padding: 40px;
            color: #666;
        }

        @media (max-width: 650px) {
            iframe {
                width: 90vw;
                height: 60vw;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Chaotic Pigeon Presents...</h1>
    </header>

    <div class="game-wrapper">
        <h2>Bouncy Ball</h2>
        <div class="game-container">
            <iframe src="/bouncyball/index.html"></iframe>
        </div>
        <div class="external-controls">
            <a href="/bouncyball/index.html" target="_blank" class="btn">Open Bouncy Ball in New Tab ↗</a>
        </div>
    </div>

    <div class="game-wrapper">
        <h2>Stickman Adventure</h2>
        <div class="game-container">
            <iframe src="/stickman"></iframe>
        </div>
        <div class="external-controls">
            <a href="/stickman" target="_blank" class="btn">Open Stickman in New Tab ↗</a>
        </div>
    </div>

    <div class="footer">
        <p>Built by Elliott</p>
    </div>

</body>
</html>
