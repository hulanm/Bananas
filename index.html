<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elliott Kodish</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin-top: 50px;
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            color: #1a1a1a;
            margin: 0;
        }

        /* Container for the game */
        .game-container {
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px solid #fff;
        }

        /* The iframe settings */
        iframe {
            width: 600px; /* Adjust width as needed */
            height: 400px; /* Adjust height as needed */
            border: none;
            border-radius: 10px;
            display: block;
        }

        .footer {
            margin-top: auto;
            padding: 40px;
            color: #666;
        }

        /* Responsive design for smaller screens */
        @media (max-width: 650px) {
            iframe {
                width: 90vw;
                height: 60vw;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>elliottkodish.com</h1>
    </header>

    <div class="game-container">
        <iframe src="/bouncyball/index.html"></iframe>
    </div>

    <div class="footer">
        <p>Built by Elliott</p>
    </div>

</body>
</html>
