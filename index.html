<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <style>
        body {
            background-color: #e0f7fa;
            color: #00796b;
            font-family: 'Arial', sans-serif;
        }
        h1 {
            color: #d81b60;
        }
        .game-container {
            border: 2px solid #00796b;
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            background-color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <h1>Welcome to Fun Games!</h1>
    <div class="game-container">
        <h2>Snake Game</h2>
        <p>Play the classic Snake Game! Try to eat as many apples as possible without hitting the walls!</p>
        <button>Start Snake Game</button>
    </div>
    <div class="game-container">
        <h2>Dog Clicker Game</h2>
        <p>Click the button to feed your dog and make it grow. How big can your dog get?</p>
        <button>Start Dog Clicker Game</button>
    </div>
</body>
</html>
