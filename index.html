<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaotic Pigeon Presents</title>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; min-height: 100vh; }
        header { margin-top: 50px; margin-bottom: 20px; text-align: center; }
        h1 { font-size: 2.5rem; font-weight: 800; color: #1a1a1a; margin: 0; }
        h2 { margin-top: 40px; color: #333; }
        .game-wrapper { display: flex; flex-direction: column; align-items: center; margin-bottom: 50px; }
        
        .game-placeholder { width: 600px; height: 400px; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 4px solid #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; }
        .game-placeholder:hover { transform: scale(1.02); }
        
        .play-btn { background: #1a1a1a; color: white; padding: 15px 40px; border-radius: 50px; font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .footer { margin-top: auto; padding: 40px; color: #666; }
        @media (max-width: 650px) { .game-placeholder { width: 90vw; height: 60vw; } }

        /* Game previews - Different colors */
        .bouncy-preview { 
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }

        .stickman-preview {
            background: linear-gradient(135deg, #00CED1 0%, #20B2AA 100%);
        }

        .bat-preview { 
            background: linear-gradient(135deg, #9370DB 0%, #8A2BE2 100%);
        }
        
        .snake-preview {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .dog-preview {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
    </style>
</head>
<body>
    <header><h1>Chaotic Pigeon Presents...</h1></header>

    <div class="game-wrapper">
        <h2>Bouncy Ball</h2>
        <a href="bouncyball/index.html" target="_blank" class="game-placeholder bouncy-preview">
            <div class="play-btn">Play Game ▶</div>
        </a>
    </div>

    <div class="game-wrapper">
        <h2>Stickman Adventure</h2>
        <a href="https://elliottkodish.com/stickman" target="_blank" class="game-placeholder stickman-preview">
            <div class="play-btn">Play Game ▶</div>
        </a>
    </div>

    <div class="game-wrapper">
        <h2>Flappy Bat</h2>
        <a href="https://elliottkodish.com/cavebat" target="_blank" class="game-placeholder bat-preview">
            <div class="play-btn">Play Game ▶</div>
        </a>
    </div>

    <div class="game-wrapper">
        <h2>Snake Game</h2>
        <a href="https://elliottkodish.com/snakegame" target="_blank" class="game-placeholder snake-preview">
            <div class="play-btn">Play Game ▶</div>
        </a>
    </div>

    <div class="game-wrapper">
        <h2>Dog Clicker Game</h2>
        <a href="https://elliottkodish.com/doggyclicker" target="_blank" class="game-placeholder dog-preview">
            <div class="play-btn">Play Game ▶</div>
        </a>
    </div>

    <div class="footer"><p>Built by Elliott</p></div>
</body>
</html>
